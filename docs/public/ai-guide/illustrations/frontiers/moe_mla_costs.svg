<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="780" viewBox="0 0 1360 780"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#506580"/></marker></defs><rect width="100%" height="100%" fill="#f7f9fc"/><text x="45" y="50" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="bold" fill="#152c48" text-anchor="start">MoE 与 MLA：优化的是两笔不同的资源账</text><text x="45" y="85" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="normal" fill="#58708e" text-anchor="start">原创教学示意 · 依据 DeepSeek-V3 的机制归纳；不是原论文结构图或性能测试</text><rect x="32" y="110" width="1296" height="270" rx="14" fill="#fff" stroke="#d7e1ea" stroke-width="2"/><text x="58" y="150" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="bold" fill="#203854" text-anchor="start">① MoE：本次计算，让 token 只经过部分前馈专家</text><rect x="60" y="208" width="120" height="70" rx="14" fill="#e5f0f7" stroke="#b9cddb" stroke-width="2"/><text x="120.0" y="251.0" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="normal" fill="#203854" text-anchor="middle">当前 token</text><path d="M185,243 L246,243" fill="none" stroke="#506580" stroke-width="3" marker-end="url(#a)" /><rect x="252" y="208" width="135" height="70" rx="14" fill="#e5f0f7" stroke="#b9cddb" stroke-width="2"/><text x="319.5" y="251.0" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="normal" fill="#203854" text-anchor="middle">路由器</text><path d="M394,243 L450,243" fill="none" stroke="#506580" stroke-width="3" marker-end="url(#a)" /><rect x="470" y="200" width="78" height="84" rx="14" fill="#f1f3f6" stroke="#d5dbe3" stroke-width="2"/><text x="509.0" y="250.0" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="normal" fill="#203854" text-anchor="middle">E1</text><rect x="562" y="200" width="78" height="84" rx="14" fill="#cde9df" stroke="#65ab93" stroke-width="2"/><text x="601.0" y="250.0" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="normal" fill="#203854" text-anchor="middle">E2</text><rect x="654" y="200" width="78" height="84" rx="14" fill="#f1f3f6" stroke="#d5dbe3" stroke-width="2"/><text x="693.0" y="250.0" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="normal" fill="#203854" text-anchor="middle">E3</text><rect x="746" y="200" width="78" height="84" rx="14" fill="#f1f3f6" stroke="#d5dbe3" stroke-width="2"/><text x="785.0" y="250.0" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="normal" fill="#203854" text-anchor="middle">E4</text><rect x="838" y="200" width="78" height="84" rx="14" fill="#cde9df" stroke="#65ab93" stroke-width="2"/><text x="877.0" y="250.0" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="normal" fill="#203854" text-anchor="middle">E5</text><rect x="930" y="200" width="78" height="84" rx="14" fill="#f1f3f6" stroke="#d5dbe3" stroke-width="2"/><text x="969.0" y="250.0" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="normal" fill="#203854" text-anchor="middle">E6</text><path d="M1020,243 L1080,243" fill="none" stroke="#506580" stroke-width="3" marker-end="url(#a)" /><rect x="1090" y="208" width="185" height="70" rx="14" fill="#e5f0f7" stroke="#b9cddb" stroke-width="2"/><text x="1182.5" y="251.0" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="normal" fill="#203854" text-anchor="middle">加权组合</text><text x="58" y="336" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="normal" fill="#203854" text-anchor="start">绿色专家参与这一步；灰色专家此步未激活，但其权重通常仍需要保存。</text><rect x="32" y="400" width="1296" height="265" rx="14" fill="#fff" stroke="#d7e1ea" stroke-width="2"/><text x="58" y="442" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="bold" fill="#203854" text-anchor="start">② MLA：跨步状态，把历史 K/V 信息压成较小的潜在表示</text><rect x="60" y="488" width="170" height="80" rx="14" fill="#e5f0f7" stroke="#b9cddb" stroke-width="2"/><text x="145.0" y="521.0" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="normal" fill="#203854" text-anchor="middle">历史 token</text><text x="145.0" y="551.0" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="normal" fill="#203854" text-anchor="middle">t₁、t₂、…</text><path d="M235,528 L305,528" fill="none" stroke="#506580" stroke-width="3" marker-end="url(#a)" /><rect x="312" y="488" width="175" height="80" rx="14" fill="#e5f0f7" stroke="#b9cddb" stroke-width="2"/><text x="399.5" y="536.0" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="normal" fill="#203854" text-anchor="middle">低秩投影</text><path d="M495,528 L558,528" fill="none" stroke="#506580" stroke-width="3" marker-end="url(#a)" /><rect x="570" y="478" width="270" height="100" rx="14" fill="#e8e1f6" stroke="#b9a6da" stroke-width="2"/><text x="705.0" y="521.0" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="normal" fill="#203854" text-anchor="middle">压缩 KV 状态</text><text x="705.0" y="551.0" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="normal" fill="#203854" text-anchor="middle">c₁、c₂、…</text><path d="M845,528 L905,528" fill="none" stroke="#506580" stroke-width="3" marker-end="url(#a)" /><rect x="915" y="478" width="357" height="100" rx="14" fill="#e5f0f7" stroke="#b9cddb" stroke-width="2"/><text x="1093.5" y="521.0" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="normal" fill="#203854" text-anchor="middle">下一步注意力计算</text><text x="1093.5" y="551.0" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="normal" fill="#203854" text-anchor="middle">结合当前查询读取历史</text><text x="58" y="622" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="normal" fill="#203854" text-anchor="start">图省略位置编码等实现细节；状态压缩与路由专家是可以组合的两种机制。</text><text x="48" y="714" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="bold" fill="#245c69" text-anchor="start">估算显存时分开记账：权重 + KV / 循环状态 + 激活与工作区 + 运行时开销</text><text x="48" y="752" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="normal" fill="#58708e" text-anchor="start">激活参数少 ≠ 只需加载少量权重；KV 较小 ≠ 模型参数也较少。</text></svg>