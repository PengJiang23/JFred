<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="548" viewBox="0 0 1000 548"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="100%" height="100%" fill="#faf8f1"/><text x="36" y="43" font-size="27" fill="#173c41" font-weight="700">AI 系统：四层实现，三种观察角度</text><text x="36" y="73" font-size="17" fill="#576a6c" font-weight="400">沿实现链路学习，再从能力、原理、评测三个角度反复检查。</text><rect x="36" y="108" width="710" height="77" rx="12" fill="#f3e9d9" stroke="none"/><text x="54" y="155" font-size="30" fill="#087f82" font-weight="700">04</text><text x="115" y="138" font-size="22" fill="#173c41" font-weight="650">业务与验收</text><text x="115" y="166" font-size="18" fill="#576a6c" font-weight="400">任务成功 · 用户体验 · 权限与审计</text><rect x="36" y="201" width="710" height="77" rx="12" fill="#e7eef7" stroke="none"/><text x="54" y="248" font-size="30" fill="#087f82" font-weight="700">03</text><text x="115" y="231" font-size="22" fill="#173c41" font-weight="650">应用编排</text><text x="115" y="259" font-size="18" fill="#576a6c" font-weight="400">检索 · 数据库 · 工具 · 工作流 / Agent</text><rect x="36" y="294" width="710" height="77" rx="12" fill="#e2f0eb" stroke="none"/><text x="54" y="341" font-size="30" fill="#087f82" font-weight="700">02</text><text x="115" y="324" font-size="22" fill="#173c41" font-weight="650">推理服务</text><text x="115" y="352" font-size="18" fill="#576a6c" font-weight="400">上下文 · KV 缓存 · 批处理 · 成本与延迟</text><rect x="36" y="387" width="710" height="77" rx="12" fill="#deecee" stroke="none"/><text x="54" y="434" font-size="30" fill="#087f82" font-weight="700">01</text><text x="115" y="417" font-size="22" fill="#173c41" font-weight="650">模型与数据</text><text x="115" y="445" font-size="18" fill="#576a6c" font-weight="400">Token · 网络参数 · 预训练 · 后训练</text><path d="M775,123 L775,445" fill="none" stroke="#95a9a6" stroke-width="2"/><text x="798" y="162" font-size="21" fill="#173c41" font-weight="650">前沿</text><text x="798" y="189" font-size="16" fill="#173c41" font-weight="400">边界在怎样移动？</text><text x="798" y="275" font-size="21" fill="#173c41" font-weight="650">原理</text><text x="798" y="302" font-size="16" fill="#173c41" font-weight="400">每层怎样工作？</text><text x="798" y="388" font-size="21" fill="#173c41" font-weight="650">评测</text><text x="798" y="415" font-size="16" fill="#173c41" font-weight="400">失败发生在哪层？</text><text x="36" y="510" font-size="20" fill="#087f82" font-weight="600">一次好回答 ≠ 一次成功任务。每一层都需要证据与约束。</text></svg>