<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="565" viewBox="0 0 1000 565"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="100%" height="100%" fill="#faf8f1"/><text x="34" y="44" font-size="26" fill="#173c41" font-weight="700">12 周学习路线：每一步都留下可以检查的产物</text><text x="34" y="76" font-size="17" fill="#576a6c" font-weight="400">建议每周 6–8 小时；时间仅作安排参考，完成标志以产物和解释能力为准。</text><rect x="34" y="117" width="300" height="170" rx="12" fill="#e4efeb" stroke="none"/><text x="52" y="147" font-size="16" fill="#087f82" font-weight="600">01–02 周</text><text x="52" y="183" font-size="25" fill="#173c41" font-weight="650">共同语言</text><text x="52" y="222" font-size="18" fill="#173c41" font-weight="400">产物：生成与日志脚本</text><text x="52" y="256" font-size="16" fill="#576a6c" font-weight="400">解释参数与上下文</text><rect x="349" y="117" width="300" height="170" rx="12" fill="#e9edf6" stroke="none"/><text x="367" y="147" font-size="16" fill="#087f82" font-weight="600">03–04 周</text><text x="367" y="183" font-size="25" fill="#173c41" font-weight="650">模型机制</text><text x="367" y="222" font-size="18" fill="#173c41" font-weight="400">产物：张量计算小实验</text><text x="367" y="256" font-size="16" fill="#576a6c" font-weight="400">解释训练与生成</text><rect x="664" y="117" width="300" height="170" rx="12" fill="#f3e9dc" stroke="none"/><text x="682" y="147" font-size="16" fill="#087f82" font-weight="600">05–06 周</text><text x="682" y="183" font-size="25" fill="#173c41" font-weight="650">有据应用</text><text x="682" y="222" font-size="18" fill="#173c41" font-weight="400">产物：文档问答基线</text><text x="682" y="256" font-size="16" fill="#576a6c" font-weight="400">定位检索与生成错误</text><rect x="34" y="310" width="300" height="170" rx="12" fill="#e4efeb" stroke="none"/><text x="52" y="340" font-size="16" fill="#087f82" font-weight="600">07–08 周</text><text x="52" y="376" font-size="25" fill="#173c41" font-weight="650">评测闭环</text><text x="52" y="415" font-size="18" fill="#173c41" font-weight="400">产物：第一次回归报告</text><text x="52" y="449" font-size="16" fill="#576a6c" font-weight="400">证明改动收益</text><rect x="349" y="310" width="300" height="170" rx="12" fill="#e9edf6" stroke="none"/><text x="367" y="340" font-size="16" fill="#087f82" font-weight="600">09–10 周</text><text x="367" y="376" font-size="25" fill="#173c41" font-weight="650">可靠执行</text><text x="367" y="415" font-size="18" fill="#173c41" font-weight="400">产物：只读工具助手</text><text x="367" y="449" font-size="16" fill="#576a6c" font-weight="400">回放失败与重试</text><rect x="664" y="310" width="300" height="170" rx="12" fill="#f3e9dc" stroke="none"/><text x="682" y="340" font-size="16" fill="#087f82" font-weight="600">11–12 周</text><text x="682" y="376" font-size="25" fill="#173c41" font-weight="650">专项深入</text><text x="682" y="415" font-size="18" fill="#173c41" font-weight="400">产物：一份对照实验</text><text x="682" y="449" font-size="16" fill="#576a6c" font-weight="400">说明收益与代价</text><text x="34" y="530" font-size="21" fill="#087f82" font-weight="650">贯穿全程：记录版本 → 保存失败 → 解释原因 → 验证改动</text></svg>