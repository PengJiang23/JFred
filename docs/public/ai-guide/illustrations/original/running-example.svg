<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="535" viewBox="0 0 1000 535"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="100%" height="100%" fill="#faf8f1"/><text x="34" y="43" font-size="26" fill="#173c41" font-weight="700">把一次“看起来答对”拆成可验收的证据链</text><text x="34" y="76" font-size="17" fill="#576a6c" font-weight="400">贯穿练习：内部技术支持助手（所有文档与字段均为教学样例）</text><rect x="34" y="104" width="932" height="78" rx="12" fill="#173c41" stroke="none"/><text x="56" y="135" font-size="15" fill="#b9d3cf" font-weight="400">用户问题</text><text x="56" y="163" font-size="23" fill="#ffffff" font-weight="600">“SDK v2 请求超时应该改哪个参数？可以自动重试吗？”</text><rect x="34" y="220" width="298" height="150" rx="12" fill="#ffffff" stroke="#c9d7d1"/><text x="52" y="252" font-size="22" fill="#173c41" font-weight="650">① 先界定问题</text><text x="52" y="285" font-size="18" fill="#173c41" font-weight="400">租户与角色是什么？</text><text x="52" y="315" font-size="18" fill="#173c41" font-weight="400">SDK 的确切版本？</text><text x="52" y="350" font-size="15" fill="#087f82" font-weight="400">权限 / 版本</text><rect x="351" y="220" width="298" height="150" rx="12" fill="#ffffff" stroke="#c9d7d1"/><text x="369" y="252" font-size="22" fill="#173c41" font-weight="650">② 再找足够证据</text><text x="369" y="285" font-size="18" fill="#173c41" font-weight="400">v2 文档：timeout_ms</text><text x="369" y="315" font-size="18" fill="#173c41" font-weight="400">重试说明：仅幂等操作</text><text x="369" y="350" font-size="15" fill="#087f82" font-weight="400">检索 / 证据</text><rect x="668" y="220" width="298" height="150" rx="12" fill="#ffffff" stroke="#c9d7d1"/><text x="686" y="252" font-size="22" fill="#173c41" font-weight="650">③ 最后验证回答</text><text x="686" y="285" font-size="18" fill="#173c41" font-weight="400">字段、单位是否一致？</text><text x="686" y="315" font-size="18" fill="#173c41" font-weight="400">是否遗漏重试前提？</text><text x="686" y="350" font-size="15" fill="#087f82" font-weight="400">正确 / 完整</text><path d="M184,183 L184,217" fill="none" stroke="#087f82" stroke-width="2"/><circle cx="184" cy="217" r="4" fill="#087f82"/><path d="M332,294 L347,294" fill="none" stroke="#087f82" stroke-width="2"/><circle cx="347" cy="294" r="4" fill="#087f82"/><path d="M649,294 L664,294" fill="none" stroke="#087f82" stroke-width="2"/><circle cx="664" cy="294" r="4" fill="#087f82"/><rect x="34" y="406" width="455" height="94" rx="12" fill="#e5efed" stroke="none"/><text x="53" y="437" font-size="19" fill="#173c41" font-weight="650">可验收的回答</text><text x="53" y="465" font-size="16" fill="#173c41" font-weight="400">按文档说明参数与单位，引用具体段落；</text><text x="53" y="487" font-size="16" fill="#173c41" font-weight="400">对不满足幂等条件的重试明确给出限制。</text><rect x="512" y="406" width="454" height="94" rx="12" fill="#f5e8de" stroke="none"/><text x="531" y="437" font-size="19" fill="#173c41" font-weight="650">需要单独授权的动作</text><text x="531" y="465" font-size="16" fill="#173c41" font-weight="400">修改线上配置、重放请求属于外部副作用；</text><text x="531" y="487" font-size="16" fill="#173c41" font-weight="400">回答正确不等于已获得执行权限。</text></svg>