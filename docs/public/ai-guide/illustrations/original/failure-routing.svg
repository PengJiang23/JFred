<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="548" viewBox="0 0 1000 548"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="100%" height="100%" fill="#faf8f1"/><text x="34" y="44" font-size="26" fill="#173c41" font-weight="700">同一个失败，先定位层级，再决定改什么</text><text x="34" y="76" font-size="18" fill="#576a6c" font-weight="400">不要一看到“答错”，就同时更换模型、提示词、检索器和评审器。</text><rect x="34" y="111" width="932" height="76" rx="12" fill="#ffffff" stroke="none"/><text x="51" y="142" font-size="20" fill="#173c41" font-weight="600">没有找到正确文档</text><text x="51" y="170" font-size="17" fill="#173c41" font-weight="400">先查解析、权限、版本过滤和召回</text><text x="732" y="140" font-size="13" fill="#576a6c" font-weight="400">要看的证据</text><text x="732" y="167" font-size="16" fill="#087f82" font-weight="400">检索命中 / 证据段落</text><rect x="34" y="201" width="932" height="76" rx="12" fill="#eaf0e9" stroke="none"/><text x="51" y="232" font-size="20" fill="#173c41" font-weight="600">找到文档却用了旧规则</text><text x="51" y="260" font-size="17" fill="#173c41" font-weight="400">先查冲突证据、排序、引用绑定</text><text x="732" y="230" font-size="13" fill="#576a6c" font-weight="400">要看的证据</text><text x="732" y="257" font-size="16" fill="#087f82" font-weight="400">检索结果 / 生成上下文</text><rect x="34" y="291" width="932" height="76" rx="12" fill="#ffffff" stroke="none"/><text x="51" y="322" font-size="20" fill="#173c41" font-weight="600">答案正确，动作却重复执行</text><text x="51" y="350" font-size="17" fill="#173c41" font-weight="400">先查状态机、幂等键与重试策略</text><text x="732" y="320" font-size="13" fill="#576a6c" font-weight="400">要看的证据</text><text x="732" y="347" font-size="16" fill="#087f82" font-weight="400">工具轨迹 / 业务状态</text><rect x="34" y="381" width="932" height="76" rx="12" fill="#eaf0e9" stroke="none"/><text x="51" y="412" font-size="20" fill="#173c41" font-weight="600">离线变好，用户仍不满意</text><text x="51" y="440" font-size="17" fill="#173c41" font-weight="400">先查样本分布、延迟与任务定义</text><text x="732" y="410" font-size="13" fill="#576a6c" font-weight="400">要看的证据</text><text x="732" y="437" font-size="16" fill="#087f82" font-weight="400">线上切片 / 人工回访</text><text x="34" y="509" font-size="19" fill="#087f82" font-weight="600">改动原则：保留一条基线，只改变能解释当前失败的一项，再跑原测试集。</text></svg>