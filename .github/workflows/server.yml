name: Deploy JFred to Lenovo

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: jfred-lenovo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish blog image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/pengjiang23/jfred:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/PengJiang23/JFred
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: VITEPRESS_BASE=/blog/
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable image reference
        id: image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ref=ghcr.io/pengjiang23/jfred@${DIGEST}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    if: github.repository == 'PengJiang23/JFred' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, Linux, X64, jfred-deploy]
    timeout-minutes: 15
    permissions:
      packages: read
    steps:
      # No source checkout or repository scripts run on the deployment host.
      - name: Deploy approved blog image with Compose
        env:
          IMAGE_REF: ${{ needs.build.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | sudo -n /usr/local/sbin/deploy-jfred "$IMAGE_REF" "$GHCR_USER"
      - name: Check public blog route
        run: curl --noproxy '*' --fail --silent --show-error --retry 5 --retry-delay 2 http://192.168.0.108/blog/ -o /dev/null
