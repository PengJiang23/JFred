# Included inside the existing JFred server block. Forward only the true client IP.
location = /blog/metrics/script.js {
    proxy_pass http://127.0.0.1:18082/script.js;
    proxy_set_header Host $host;
}
location = /blog/metrics/api/send {
    proxy_pass http://127.0.0.1:18082/api/send;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 32k;
}
location = /blog/metrics/api/share/jfred-public {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:18082/api/share/jfred-public;
    proxy_set_header Host $host;
}
location = /blog/metrics/api/websites/fa4e9f07-6328-46d1-ad63-16ab7ec3682a/stats {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:18082/api/websites/fa4e9f07-6328-46d1-ad63-16ab7ec3682a/stats;
    proxy_set_header Host $host;
}
location ^~ /blog/metrics/ { return 404; }
