name: jfred-community
services:
  artalk:
    image: artalk/artalk-go:2.10.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:18081:23366'
    environment:
      TZ: Asia/Shanghai
      ATK_LOCALE: zh-CN
      ATK_SITE_DEFAULT: JFred
      ATK_SITE_URL: http://192.168.0.108/blog/
    volumes:
      - ./artalk:/data
    logging: &logging
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
  umami:
    image: ghcr.io/umami-software/umami:3.4.0
    restart: unless-stopped
    init: true
    networks: [default, database]
    ports:
      - '127.0.0.1:18082:3000'
    environment:
      DATABASE_URL: postgresql://umami:${POSTGRES_PASSWORD}@${POSTGRES_CONTAINER:?Required}:5432/umami
      APP_SECRET: ${APP_SECRET:?Required}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:?Required}
      SALT_ROTATION: day
      TZ: Asia/Shanghai
      DISABLE_TELEMETRY: '1'
      TRACKER_SCRIPT_NAME: script.js
    logging: *logging
  duplicati:
    image: duplicati/duplicati:2.4.0.1
    restart: unless-stopped
    ports:
      - '127.0.0.1:18083:8200'
    environment:
      TZ: Asia/Shanghai
      SETTINGS_ENCRYPTION_KEY: ${DUPLICATI_SETTINGS_KEY:?Required}
      DUPLICATI__WEBSERVICE_PASSWORD: ${DUPLICATI_PASSWORD:?Required}
    volumes:
      - ./duplicati:/data
      - /opt/backups/jfred:/source:ro
      - /opt/backups/jfred-duplicati:/backups
    logging: *logging
  openlist:
    image: openlistteam/openlist:v4.2.7-lite
    restart: unless-stopped
    ports:
      - '127.0.0.1:18084:5244'
    environment:
      TZ: Asia/Shanghai
      OPENLIST_ADMIN_PASSWORD: ${OPENLIST_PASSWORD:?Required}
      UMASK: '077'
    volumes:
      - ./openlist:/opt/openlist/data
    logging: *logging

networks:
  database:
    external: true
    name: 1panel-network
